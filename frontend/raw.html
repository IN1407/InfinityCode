<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raw · InfinityCode</title>
<!-- the palette and the fonts come from the app; the layout below is this
     window's own, because nothing here looks like a chat -->
<link rel="stylesheet" href="/static/style.css">
<style>
body{display:flex;flex-direction:column;height:100vh;overflow:hidden}

.raw-top{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:12px 18px;flex-shrink:0;
  border-bottom:1px solid rgba(191,149,63,.22);
  background:rgba(4,9,22,.82);
}
.raw-top h1{font-size:14px;font-weight:600;letter-spacing:.2px}
.raw-top h1 span{color:var(--gold);font-weight:500}
.raw-sub{font-size:11.5px;color:var(--dim);margin-top:2px}
.raw-top-spacer{flex:1}

.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex-shrink:0}
.status{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted)}
.status.live .dot{background:#5fd08a;box-shadow:0 0 7px #5fd08a}
.status.gen  .dot{background:var(--gold);box-shadow:0 0 7px var(--gold);
  animation:pulse 1.1s ease-in-out infinite}
.status.gone .dot{background:var(--danger)}
@keyframes pulse{50%{opacity:.3}}

.raw-body{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:16px 18px 60px;
  display:flex;flex-direction:column;gap:14px;
  scroll-behavior:auto;                 /* jumps, never animates: smooth
                                           scrolling fights a live stream */
}
/* Flex items shrink to fit their container by default, which for a column
   this tall means a long reply gets squashed and clipped instead of making
   the page scroll. Every block keeps its own height; the container scrolls. */
.raw-body > *{flex-shrink:0}

/* ---------------------------------------------------------------- blocks -- */
.block{border:1px solid rgba(191,149,63,.18);border-radius:10px;
  background:rgba(6,12,30,.55);overflow:hidden}
.block.request{border-color:rgba(191,149,63,.34)}
.block.output{border-color:rgba(120,160,255,.26)}
.block.output.reasoning{border-color:rgba(147,165,199,.22)}

.block-head{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:9px 13px;font-size:11.5px;
  background:rgba(191,149,63,.07);
  border-bottom:1px solid rgba(191,149,63,.14);
}
.block.output .block-head{background:rgba(120,160,255,.07);
  border-bottom-color:rgba(120,160,255,.16)}
.tag{
  font-family:var(--mono);font-size:10px;letter-spacing:1.1px;text-transform:uppercase;
  padding:2.5px 7px;border-radius:5px;
  background:rgba(191,149,63,.16);color:var(--gold-light);
  border:1px solid rgba(191,149,63,.3);
}
.block.output .tag{background:rgba(120,160,255,.15);color:#bcd0ff;
  border-color:rgba(120,160,255,.3)}
.block.output.reasoning .tag{background:rgba(147,165,199,.14);color:var(--muted);
  border-color:rgba(147,165,199,.26)}
.who{color:var(--ink);font-weight:500}
.meta{color:var(--dim)}
.head-spacer{flex:1}

.mini{
  font-family:var(--font);font-size:10.5px;letter-spacing:.4px;
  padding:3px 9px;border-radius:6px;cursor:pointer;
  color:var(--muted);background:rgba(6,12,30,.6);
  border:1px solid rgba(191,149,63,.22);
}
.mini:hover{color:var(--ink);border-color:var(--gold)}
.mini.on{color:var(--gold-light);border-color:var(--gold);background:rgba(191,149,63,.16)}

.endpoint{
  padding:7px 13px;font-family:var(--mono);font-size:11px;color:var(--dim);
  border-bottom:1px solid rgba(191,149,63,.1);
  white-space:pre-wrap;word-break:break-all;
}
.endpoint b{color:var(--muted);font-weight:500}

pre.code{
  margin:0;padding:12px 14px;
  font-family:var(--mono);font-size:12px;line-height:1.55;
  color:var(--ink);
  white-space:pre-wrap;word-break:break-word;
  tab-size:2;
}
/* Only a request is capped. A request is finished the moment it appears and
   is often enormous, so it gets a box of its own to scroll in; a reply is
   still being written, and has to be allowed to grow the page -- that growth
   is the thing following the output is following. */
pre.code.capped{max-height:440px;overflow:auto}
pre.code.capped.tall{max-height:none}
pre.code.nowrap{white-space:pre;word-break:normal;overflow-x:auto}
.block.output pre.code{color:#dbe6ff}
.block.output.reasoning pre.code{color:var(--muted);font-style:italic}

/* json, coloured only so a long messages array can be read at a glance */
.j-key{color:var(--gold-light)}
.j-str{color:#a8e6b0}
.j-num{color:#f0b98a}
.j-bool{color:#8fb8ff}
.j-null{color:var(--dim)}

/* ----------------------------------------------------------- turn + note -- */
.turn{display:flex;align-items:center;gap:12px;margin-top:8px}
.turn:first-child{margin-top:0}
.turn hr{flex:1;border:0;border-top:1px solid rgba(191,149,63,.22)}
.turn-label{
  font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold);
  white-space:nowrap;
}
.turn-prompt{
  padding:10px 14px;border-radius:10px;
  border:1px solid rgba(191,149,63,.2);
  background:rgba(191,149,63,.06);
  font-size:12.5px;line-height:1.55;color:var(--gold-light);
  white-space:pre-wrap;word-break:break-word;
  max-height:180px;overflow:auto;
}
.note{
  padding:8px 13px;border-radius:8px;font-size:12px;
  font-family:var(--mono);color:var(--muted);
  border:1px solid rgba(147,165,199,.18);background:rgba(6,12,30,.45);
  white-space:pre-wrap;word-break:break-word;
}
.note.error{color:var(--danger);border-color:rgba(255,128,128,.3);
  background:rgba(255,128,128,.06)}

.empty{color:var(--dim);font-size:13px;text-align:center;padding:48px 20px;line-height:1.7}

/* --------------------------------------------------------------- follow --- */
/* Only ever shown when following is off, which is to say only when the user
   has scrolled away from the live end themselves. */
.jump{
  position:fixed;right:24px;bottom:22px;
  display:none;align-items:center;gap:7px;
  padding:9px 15px;border-radius:20px;cursor:pointer;
  font-size:12px;color:var(--gold-light);
  background:rgba(10,18,40,.94);
  border:1px solid var(--gold);
  box-shadow:0 6px 22px rgba(0,0,0,.5);
}
.jump.show{display:flex}
.jump:hover{background:rgba(191,149,63,.2)}
</style>
</head>
<body>

<header class="raw-top">
  <div>
    <h1>Raw <span>· what goes to the model</span></h1>
    <p class="raw-sub" id="sub">connecting…</p>
  </div>
  <div class="raw-top-spacer"></div>
  <button class="mini" id="wrapBtn" type="button" title="Wrap long lines, or let them scroll sideways">Wrap: on</button>
  <button class="mini" id="expandBtn" type="button" title="Show every request in full instead of capping its height">Expand all</button>
  <button class="mini on" id="followBtn" type="button" title="Follow the output as it is generated">Following</button>
  <div class="status" id="status"><i class="dot"></i><span id="statusText">connecting</span></div>
</header>

<main class="raw-body" id="log">
  <p class="empty" id="empty">Nothing has been sent to the model in this chat yet.<br>
    Ask something in the chat window and the request will appear here.</p>
</main>

<button class="jump" id="jump" type="button">↓ Jump to the live end</button>

<script>
const $ = (s) => document.querySelector(s);
const chatId = new URLSearchParams(location.search).get('chat') || '';
const log = $('#log');

/* ===================================================== following the end == */
/* Stick to the bottom while generating, but the moment the user scrolls up to
   read a prompt, stop -- and start again only when they come back down or say
   so. Our own scrolling lands at the bottom, so it re-arms rather than
   cancelling itself. */

let follow = true;
let dragging = false;                    // the scrollbar is being dragged
const AT_END = 48;                       // px of slack that still counts as "at the end"

const atEnd = () => log.scrollHeight - log.scrollTop - log.clientHeight <= AT_END;

function setFollow(on) {
  follow = on;
  $('#followBtn').classList.toggle('on', on);
  $('#followBtn').textContent = on ? 'Following' : 'Not following';
  $('#jump').classList.toggle('show', !on);
}

function toEnd() {
  if (dragging) return;                  // never fight a drag that is happening
  log.scrollTop = log.scrollHeight;
}

/* The scroll event on its own cannot tell "the user scrolled up" from "we
   scrolled down": an append queued a moment ago lands between the two and
   pulls the page back under them, which is the one thing this must not do.
   So the decision is taken from the gesture, which arrives before the
   scrolling does -- by the time any queued append runs, follow is already
   off and it leaves the page alone. The scroll event is left to do the one
   thing it is good for, which is noticing the user has come back to the end. */
const away = () => { if (follow) setFollow(false); };

log.addEventListener('wheel', (e) => { if (e.deltaY < 0) away(); }, { passive: true });
log.addEventListener('touchmove', () => { if (!atEnd()) away(); }, { passive: true });
log.addEventListener('mousedown', () => { dragging = true; });
window.addEventListener('mouseup', () => { dragging = false; });
window.addEventListener('keydown', (e) => {
  if (e.key === 'PageUp' || e.key === 'ArrowUp' || e.key === 'Home' ||
      (e.key === ' ' && e.shiftKey)) away();
});

log.addEventListener('scroll', () => {
  const end = atEnd();
  if (end !== follow) setFollow(end);
});

$('#followBtn').onclick = () => { setFollow(!follow); if (follow) toEnd(); };
$('#jump').onclick = () => { setFollow(true); toEnd(); };

/* Appending is throttled: a fast stream can deliver hundreds of deltas a
   second and there is no point laying the page out for every one of them. A
   timer rather than requestAnimationFrame, because rAF stops while the window
   is in the background and this window very often is. */
let painting = false;
function touch() {
  if (painting) return;
  painting = true;
  setTimeout(() => {
    painting = false;
    flush();
    if (follow) toEnd();
  }, 60);
}

/* ============================================================== rendering = */

let wrap = true, expanded = false;
const codes = [];                        // every <pre>, for the two toggles
const streams = new Map();               // call:channel -> the block being written

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};

const escape = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

/* Pretty json is easier to read in colour, but a very large body is not worth
   a regex pass over -- it is shown plain instead. */
const HIGHLIGHT_LIMIT = 400000;
function paintJSON(pre, text) {
  if (text.length > HIGHLIGHT_LIMIT) { pre.textContent = text; return; }
  pre.innerHTML = escape(text).replace(
    /("(?:\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*"\s*:?|\b(?:true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+\-]?\d+)?)/g,
    (m) => {
      let cls = 'num';
      if (m[0] === '"') cls = m.trimEnd().endsWith(':') ? 'key' : 'str';
      else if (m === 'null') cls = 'null';
      else if (m === 'true' || m === 'false') cls = 'bool';
      return '<span class="j-' + cls + '">' + m + '</span>';
    });
}

/* The same request with the turns unrolled. Json has to escape every newline
   in a string, which turns a system prompt into one very long line; this is
   the same bytes laid out so they can actually be read. Nothing is added and
   nothing is dropped -- the exact json is one click away at all times. */
function readable(body) {
  let obj;
  try { obj = JSON.parse(body); } catch (e) { return null; }
  const out = [];
  const rule = (name) => '───── ' + name + ' ' + '─'.repeat(Math.max(3, 58 - name.length));
  const text = (v) => {
    if (typeof v === 'string') return v;
    if (Array.isArray(v)) return v.map((b) => (b && typeof b.text === 'string')
      ? b.text : JSON.stringify(b, null, 2)).join('\n');
    return JSON.stringify(v, null, 2);
  };
  const add = (role, v) => { out.push(rule(role), text(v), ''); };

  if (obj.system !== undefined) add('system', obj.system);
  if (obj.config && obj.config.system_instruction !== undefined) {
    add('system', obj.config.system_instruction);
  }
  const turns = obj.messages || obj.contents;
  if (!Array.isArray(turns)) return out.length ? out.join('\n') : null;
  turns.forEach((m) => {
    add(m.role || 'message', m.content !== undefined ? m.content : (m.parts || m));
  });

  // Whatever else rode along with the turns: model, sampling, the rest.
  const rest = {};
  Object.keys(obj).forEach((k) => {
    if (k !== 'messages' && k !== 'contents' && k !== 'system' && k !== 'config') {
      rest[k] = obj[k];
    }
  });
  if (obj.config) {
    const c = Object.assign({}, obj.config);
    delete c.system_instruction;
    if (Object.keys(c).length) rest.config = c;
  }
  if (Object.keys(rest).length) {
    out.push(rule('everything else sent with them'), JSON.stringify(rest, null, 2));
  }
  return out.join('\n');
}

function makeCode(capped) {
  const pre = el('pre', 'code' + (capped ? ' capped' : ''));
  if (!wrap) pre.classList.add('nowrap');
  if (capped && expanded) pre.classList.add('tall');
  codes.push(pre);
  return pre;
}

function place(node) {
  const gone = $('#empty');
  if (gone) gone.remove();
  log.appendChild(node);
  return node;
}

const clock = (ts) => new Date(ts * 1000).toLocaleTimeString();

/* ------------------------------------------------------------- a request -- */
function drawRequest(ev) {
  const block = el('div', 'block request');

  const head = el('div', 'block-head');
  head.append(
    el('span', 'tag', 'request #' + ev.call),
    el('span', 'who', ev.label + ' / ' + ev.model),
    el('span', 'meta', '· ' + ev.path + (ev.role ? ' · ' + ev.role : '') +
                       ' · ' + (ev.format === 'json' ? 'json' : 'rendered prompt') +
                       ' · ' + clock(ev.ts)));
  head.appendChild(el('span', 'head-spacer'));

  const pre = makeCode(true);
  const asJSON = ev.format === 'json';
  const plain = readable(ev.body);

  const show = (mode) => {
    if (mode === 'readable' && plain !== null) pre.textContent = plain;
    else if (asJSON) paintJSON(pre, ev.body);
    else pre.textContent = ev.body;
  };

  if (asJSON && plain !== null) {
    let mode = 'exact';
    const toggle = el('button', 'mini', 'Readable');
    toggle.type = 'button';
    toggle.title = 'The same request with the turns unrolled. It is not what was sent — the exact json is.';
    toggle.onclick = () => {
      mode = mode === 'exact' ? 'readable' : 'exact';
      toggle.classList.toggle('on', mode === 'readable');
      toggle.textContent = mode === 'readable' ? 'Exact json' : 'Readable';
      show(mode);
    };
    head.appendChild(toggle);
  }

  const copy = el('button', 'mini', 'Copy');
  copy.type = 'button';
  copy.title = 'Copy exactly what was sent';
  copy.onclick = () => {
    navigator.clipboard.writeText(ev.body).then(
      () => { copy.textContent = 'Copied'; setTimeout(() => { copy.textContent = 'Copy'; }, 1200); },
      () => { copy.textContent = 'Cannot copy'; setTimeout(() => { copy.textContent = 'Copy'; }, 1600); });
  };
  head.appendChild(copy);

  block.appendChild(head);

  if (ev.endpoint) {
    const line = el('div', 'endpoint');
    line.append(el('b', null, 'POST '), document.createTextNode(ev.endpoint));
    if (ev.headers) {
      Object.keys(ev.headers).forEach((k) => {
        line.append(document.createTextNode('\n' + k + ': ' + ev.headers[k]));
      });
    }
    block.appendChild(line);
  }

  show('exact');
  block.appendChild(pre);
  place(block);
}

/* --------------------------------------------------------------- a reply -- */
/* One block per call per channel, written into as the deltas land. The buffer
   is what makes a fast stream cheap: the page is touched once per flush, not
   once per token. */

function streamFor(ev) {
  const key = ev.call + ':' + ev.channel;
  let got = streams.get(key);
  if (got) return got;

  const reasoning = ev.channel === 'reasoning';
  const block = el('div', 'block output' + (reasoning ? ' reasoning' : ''));
  const head = el('div', 'block-head');
  head.append(
    el('span', 'tag', reasoning ? 'reasoning #' + ev.call : 'reply #' + ev.call),
    el('span', 'meta', reasoning
      ? 'the model thinking, as it arrives'
      : 'the model answering, as it arrives'));
  head.appendChild(el('span', 'head-spacer'));

  const pre = makeCode(false);
  const copy = el('button', 'mini', 'Copy');
  copy.type = 'button';
  copy.onclick = () => {
    navigator.clipboard.writeText(pre.textContent).then(
      () => { copy.textContent = 'Copied'; setTimeout(() => { copy.textContent = 'Copy'; }, 1200); },
      () => {});
  };
  head.append(copy);

  block.append(head, pre);
  place(block);
  got = { pre: pre, buffered: '' };
  streams.set(key, got);
  return got;
}

function flush() {
  streams.forEach((s) => {
    if (!s.buffered) return;
    // A text node per flush rather than rewriting the whole block: appending
    // stays cheap however long the reply gets.
    s.pre.appendChild(document.createTextNode(s.buffered));
    s.buffered = '';
  });
}

/* ================================================================ events == */

function draw(ev) {
  if (ev.type === 'request') { drawRequest(ev); return; }

  if (ev.type === 'output') {
    const s = streamFor(ev);
    s.buffered += ev.text;
    touch();
    return;
  }

  if (ev.type === 'turn') {
    if (ev.kind === 'start') {
      const row = el('div', 'turn');
      row.append(el('hr'), el('span', 'turn-label', 'turn · ' + clock(ev.ts)), el('hr'));
      place(row);
      if (ev.text) place(el('div', 'turn-prompt', ev.text));
    } else {
      const row = el('div', 'turn');
      row.append(el('hr'), el('span', 'turn-label', 'turn ended'), el('hr'));
      place(row);
    }
    return;
  }

  if (ev.type === 'note') {
    place(el('div', 'note' + (ev.level === 'error' ? ' error' : ''), ev.text));
  }
}

/* ============================================================== the socket = */

let sock = null, retry = null, generating = false;

function status(cls, text) {
  $('#status').className = 'status ' + cls;
  $('#statusText').textContent = text;
}

function reset() {
  log.innerHTML = '';
  log.appendChild(Object.assign(el('p', 'empty'), {
    innerHTML: 'Nothing has been sent to the model in this chat yet.<br>' +
               'Ask something in the chat window and the request will appear here.',
    id: 'empty',
  }));
  codes.length = 0;
  streams.clear();
}

function connect() {
  if (!chatId) {
    status('gone', 'no chat');
    $('#sub').textContent = 'This window was opened without a chat to watch.';
    return;
  }
  const scheme = location.protocol === 'https:' ? 'wss://' : 'ws://';
  sock = new WebSocket(scheme + location.host + '/api/chats/' + encodeURIComponent(chatId) + '/raw');

  sock.onopen = () => { reset(); status('live', 'connected'); };

  sock.onmessage = (e) => {
    const ev = JSON.parse(e.data);

    if (ev.type === 'ready') {
      document.title = 'Raw · ' + (ev.title || 'InfinityCode');
      $('#sub').textContent = ev.title
        ? 'every request sent for “' + ev.title + '”, and every reply'
        : 'every request sent for this chat, and every reply';
      flush();
      if (follow) toEnd();               // the replay lands at the live end
      status(generating ? 'gen' : 'live', generating ? 'generating' : 'waiting');
      return;
    }

    if (ev.type === 'turn') generating = ev.kind === 'start';
    if (ev.type === 'request') generating = true;
    status(generating ? 'gen' : 'live', generating ? 'generating' : 'waiting');

    draw(ev);
    // Requests, turns and notes are single nodes: they are placed straight
    // away, so keeping up with the end is this one line.
    if (ev.type !== 'output' && follow) toEnd();
  };

  sock.onclose = () => {
    status('gone', 'disconnected — retrying');
    if (retry) clearTimeout(retry);
    retry = setTimeout(connect, 2000);
  };

  sock.onerror = () => { try { sock.close(); } catch (e) {} };
}

/* ============================================================== toggles === */

$('#wrapBtn').onclick = () => {
  wrap = !wrap;
  $('#wrapBtn').textContent = 'Wrap: ' + (wrap ? 'on' : 'off');
  codes.forEach((p) => p.classList.toggle('nowrap', !wrap));
};

$('#expandBtn').onclick = () => {
  expanded = !expanded;
  $('#expandBtn').classList.toggle('on', expanded);
  $('#expandBtn').textContent = expanded ? 'Collapse all' : 'Expand all';
  codes.forEach((p) => { if (p.classList.contains('capped')) p.classList.toggle('tall', expanded); });
  if (follow) toEnd();
};

setFollow(true);
connect();
</script>
</body>
</html>
